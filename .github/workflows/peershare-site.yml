name: PeerShare site

# Publishes the PeerShare page to https://peershare.sandclaw.ai (decision 2.8) with
# statewalker/.github's publish-site.yml: the files go to httpeers' `sites` bucket under that
# name, and the sites host serves them at once. `build:site` writes the page, `peershare.json`
# (the relay's addresses, read from its own document, and the session zone *.s.sandclaw.ai, whose shell is published by hand: see the app's README) and
# `.site/config.json` (`spa: true`, so /peer-share/invite is the page too). The UI gallery
# (apps/peershare.share-react/gallery: the usage scenarios, screen by screen) goes under /ui/,
# and the help site (apps/peershare.help, Astro: usage, architecture, why it is safe) under /help/.
#
# Needs the HTTPEERS_S3_ACCESS_KEY_ID and HTTPEERS_S3_SECRET_ACCESS_KEY repository secrets: a
# RustFS user that may write only the peershare.sandclaw.ai and s.sandclaw.ai prefixes of the
# bucket, made and stored by statewalker/cellb.dev's site/scripts/setup-publish-secrets.sh
# (REPO=statewalker/sandclaw SITE_USER=peershare-site SITE_DOMAIN=peershare.sandclaw.ai
# SITE_DOMAINS="peershare.sandclaw.ai s.sandclaw.ai peershare-demo.sandclaw.ai"; the last
# is the example site's, peershare-demo-site.yml: re-running without it takes it away). They are the names cellb.dev uses;
# publish-site.yml calls them SITES_S3_*, so they are passed explicitly below.

on:
  push:
    branches: [main]
    paths:
      - "apps/peershare.app/**"
      - "apps/peershare.share/**"
      - "apps/peershare.share-react/**"
      - "apps/peershare.help/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/peershare-site.yml"
  workflow_dispatch:

jobs:
  # Only a commit that passes the shared CI is published.
  ci:
    uses: statewalker/.github/.github/workflows/ci.yml@main

  site:
    needs: ci
    uses: statewalker/.github/.github/workflows/publish-site.yml@main
    with:
      domain: peershare.sandclaw.ai
      build: |
        pnpm --filter "@statewalker/peershare.app^..." run --if-present build
        pnpm --filter @statewalker/peershare.app build:site
        pnpm --filter @statewalker/peershare.share-react build:gallery --outDir "$PWD/apps/peershare.app/site/peershare.sandclaw.ai/ui"
        pnpm --filter @statewalker/peershare.help build
        mkdir -p apps/peershare.app/site/peershare.sandclaw.ai/help
        cp -R apps/peershare.help/dist/. apps/peershare.app/site/peershare.sandclaw.ai/help/
      path: apps/peershare.app/site/peershare.sandclaw.ai
    secrets:
      SITES_S3_ACCESS_KEY_ID: ${{ secrets.HTTPEERS_S3_ACCESS_KEY_ID }}
      SITES_S3_SECRET_ACCESS_KEY: ${{ secrets.HTTPEERS_S3_SECRET_ACCESS_KEY }}

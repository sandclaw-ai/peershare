name: PeerShare example site

# Publishes apps/peershare.app/example-site to https://peershare-demo.sandclaw.ai: a small
# static site (pages, a stylesheet, an image, JSON read by a script) to try PeerShare with.
# It is a remote https:// site with a domain name, so PeerShare shares it directly; its
# `.site/config.json` lists PeerShare's origin under `cors`, so the page may read it
# (httpeers' sites host answers the CORS headers and the preflight).
#
# Needs the HTTPEERS_S3_ACCESS_KEY_ID and HTTPEERS_S3_SECRET_ACCESS_KEY secrets (the ones the
# PeerShare site uses) to be allowed to write the peershare-demo.sandclaw.ai prefix too:
# statewalker/cellb.dev's site/scripts/setup-publish-secrets.sh with
# REPO=statewalker/sandclaw SITE_USER=peershare-site SITE_DOMAIN=peershare.sandclaw.ai
# SITE_DOMAINS="peershare.sandclaw.ai s.sandclaw.ai peershare-demo.sandclaw.ai".

on:
  push:
    branches: [main]
    paths:
      - "apps/peershare.app/example-site/**"
      - ".github/workflows/peershare-demo-site.yml"
  workflow_dispatch:

jobs:
  site:
    uses: statewalker/.github/.github/workflows/publish-site.yml@main
    with:
      domain: peershare-demo.sandclaw.ai
      path: apps/peershare.app/example-site
    secrets:
      SITES_S3_ACCESS_KEY_ID: ${{ secrets.HTTPEERS_S3_ACCESS_KEY_ID }}
      SITES_S3_SECRET_ACCESS_KEY: ${{ secrets.HTTPEERS_S3_SECRET_ACCESS_KEY }}
